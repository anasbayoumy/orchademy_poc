name: Build and Push to Pre-Deployment

on:
  push:
    branches:
      - dev

# This permission is required to allow the action to push to the branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from the dev branch
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred version
          cache: 'npm'

      # 3. Install Dependencies
      # We use 'npm ci' instead of 'install' for faster, consistent builds in CI
      - name: Install Dependencies
        run: npm ci

      # 4. Build the project
      # This generates the 'dist' folder
      - name: Build
        run: npm run build

      # 5. Push the 'dist' folder to the 'pre-deployment' branch
      # If the branch doesn't exist, this action creates it automatically.
      - name: Deploy to pre-deployment branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main # The branch the action should deploy to.
          folder: dist           # The folder the action should deploy.
          clean: true            # Automatically remove deleted files from the deploy branch